<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>TripPlanner — 自助旅行神隊友</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2F6FED" />
    <link rel="icon" type="image/png" href="icon-192.png" />

    <!-- iOS 加入主畫面 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TripPlanner" />
    <link rel="apple-touch-icon" href="icon-180.png" />

    <!-- react-native-web 建議的樣式 reset -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>請啟用 JavaScript 才能使用 TripPlanner。</noscript>
    <div id="root"></div>
    <script>
      // 註冊 service worker（離線快取 app shell）；本機開發不註冊以免快取干擾
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js');
        });
      }
    </script>
  </body>
</html>
