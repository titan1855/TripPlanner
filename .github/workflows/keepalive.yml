name: Supabase Keepalive

# 每 3 天打一次 Supabase，避免免費專案因 7 天無活動被暫停。
# 注意：GitHub 會在 repo「連續 60 天無 commit」後自動停用排程 workflow，
# 屆時需到 Actions 頁面手動重新啟用，或推一個 commit 即可恢復。

on:
  schedule:
    # 每月 1,4,7,...,28,31 日 06:00 UTC 觸發（最大間隔約 3 天，遠小於 7 天上限）
    - cron: "0 6 */3 * *"
  workflow_dispatch: # 也可手動觸發測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://mcldqmmvsciuvnkscjhi.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_GlCwKMFABQdO_ktItTB1ew_V-HCyzfX
        run: |
          # 對 trips 表做一筆 select 查詢，會實際打到 Postgres = 產生活動
          # （RLS 對 anon 會回空集合，但查詢本身已算活動，這正是我們要的）
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/trips?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $code"
          # 2xx / 401 / 403 都代表 DB 有回應（活動已產生）；只有連不上才算失敗
          if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then
            echo "::error::Supabase ping failed (HTTP $code)"
            exit 1
          fi
