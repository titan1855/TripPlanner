name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web (expo export)
        run: npx expo export --platform web
        env:
          # Supabase anon key 本來就會打包進前端 bundle（公開金鑰，資料由 RLS 保護）
          EXPO_PUBLIC_SUPABASE_URL: https://mcldqmmvsciuvnkscjhi.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_GlCwKMFABQdO_ktItTB1ew_V-HCyzfX

      - name: SPA fallback + disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
